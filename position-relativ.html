<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position:relative & position:absolute</title>
    <style>
        body{
            margin: 0;
            height: 3000px;
            margin-right: 0;
        }
        .div-1{
            background-color: blue;
            width: 300px;
            height: 300px;
        }
        .div-2{
            background-color: antiquewhite;
            width: 300px;
            height: 300px;
            position: relative;
        }
        .heading{
            background-color: black;
            color: white;
            position: fixed;
            width: 100%;
            left: 0;
            right:0;
            top: 0;
            /* padding: 100px; */
            height: 50px;
            z-index: 1;
        }
        .text-1{
            position: absolute;
            top: 0;
            opacity: 1;
            color: red;
            font: bold;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <div class="heading">Header</div>
    <div class="div-1">Div One</div>
    <div class="div-2">Div Two</div>
    <div class="text-1">
        This IS TEXT
    </div>
</body>
</html>
